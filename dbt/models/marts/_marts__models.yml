version: 2

models:

  - name: marts_sykmeldinger
    description: >
      Entitetsmart med én rad per sykmelding. Perioder og valideringsregler
      ligger nøstet.
    columns:
      - name: id
        description: Unik identifikator for sykmeldingen.
        data_tests:
          - unique
          - not_null

  - name: marts_perioder
    description: >
      Entitetsmart med én rad per periode.
    columns:
      - name: id
        description: Unik identifikator for sykmeldingen.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id
            - fom
            - tom

  - name: marts_regelutfall
    description: >
      Entitetsmart med én rad per regelutfall.
    columns:
      - name: id
        description: Unik identifikator for sykmeldingen.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id
            - type
